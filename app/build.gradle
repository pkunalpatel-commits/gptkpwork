plugins {
    id 'com.android.application'
}
android {
    namespace 'com.niftyoiprofile.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.niftyoiprofile.app'
        minSdk 24
        targetSdk 35
        versionCode 49
        versionName '2.9.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
